<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GEEK.EXE — Retro Idle</title>
<meta name="theme-color" content="#000">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--fg:#33ff66;--bg:#020a04;--acc:#ffcc33;--dim:#1a7a33;--win:#c0c0c0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:var(--fg);font-family:'VT323',monospace;font-size:20px;overflow-x:hidden;user-select:none}
body{min-height:100vh;display:flex;justify-content:center;transition:background 1s}
#crt{position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px);box-shadow:inset 0 0 120px rgba(0,0,0,.9)}
#crt:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.6));animation:flick 4s infinite}
@keyframes flick{50%{opacity:.85}}
#app{width:100%;max-width:520px;padding:8px 8px 40px}
.title{font-family:'Press Start 2P';font-size:13px;text-align:center;padding:8px;color:var(--acc);text-shadow:0 0 6px var(--acc)}
.bar{display:flex;justify-content:space-between;font-family:'Press Start 2P';font-size:9px;background:#000;border:2px solid var(--fg);padding:6px;box-shadow:0 0 8px var(--fg)}
.big{text-align:center;margin:8px 0}
#bytes{font-family:'Press Start 2P';font-size:22px;text-shadow:0 0 10px var(--fg)}
#bps{font-size:20px;color:var(--dim)}
canvas{width:100%;image-rendering:pixelated;border:3px solid var(--fg);box-shadow:0 0 14px var(--fg);display:block;background:#000}
#tap{display:block;width:100%;margin:10px 0;padding:18px;font-family:'Press Start 2P';font-size:14px;color:#000;background:var(--fg);border:none;border-bottom:6px solid var(--dim);box-shadow:0 0 16px var(--fg);cursor:pointer}
#tap:active{transform:translateY(4px);border-bottom-width:2px}
.tabs{display:flex;gap:4px;margin-top:8px}
.tabs button{flex:1;font-family:'Press Start 2P';font-size:9px;padding:10px 2px;background:var(--win);color:#000;border:3px outset #fff;cursor:pointer}
.tabs button.on{border-style:inset;background:#a0a0a0}
.panel{border:2px solid var(--fg);border-top:none;background:rgba(0,0,0,.7);padding:6px;min-height:200px}
.item{display:flex;align-items:center;gap:8px;padding:8px;margin:4px 0;border:2px solid var(--dim);cursor:pointer;transition:.1s}
.item.ok{border-color:var(--fg);box-shadow:0 0 6px var(--fg)}
.item.no{opacity:.45}
.item.hide{filter:blur(3px);opacity:.25;pointer-events:none}
.item:active{transform:scale(.98)}
.ico{font-size:28px;width:36px;text-align:center}
.inf{flex:1;line-height:1}
.nm{font-family:'Press Start 2P';font-size:9px;color:var(--acc)}
.ds{font-size:17px;color:var(--dim)}
.cs{font-size:19px}
.cnt{font-family:'Press Start 2P';font-size:14px}
.era{font-family:'Press Start 2P';font-size:9px;margin:6px 0}
.prog{height:12px;border:2px solid var(--fg);margin:4px 0}.prog div{height:100%;background:var(--fg);box-shadow:0 0 6px var(--fg)}
.log{font-size:17px;height:60px;overflow:hidden;color:var(--dim);margin-top:6px}
.btn{font-family:'Press Start 2P';font-size:10px;padding:12px;width:100%;margin-top:8px;background:var(--acc);border:none;cursor:pointer}
.btn:disabled{opacity:.3}
.aud{display:flex;gap:6px}.aud button{font-size:16px;background:#000;border:2px solid var(--fg);color:var(--fg);padding:2px 6px;cursor:pointer}.aud button.off{opacity:.4}
.bar{align-items:center}
#buffs{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:4px;margin-bottom:4px}#buffs span{font-family:'Press Start 2P';font-size:8px;background:var(--acc);color:#000;padding:4px;animation:pulse 1s infinite}#buffs span.bad{background:#f33;color:#fff}
@keyframes pulse{50%{opacity:.6}}
#toasts{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:70;width:92%;max-width:420px;pointer-events:none}
.toast{background:var(--win);color:#000;border:3px outset #fff;padding:8px;margin-bottom:6px;font-size:19px;animation:tin .3s}
@keyframes tin{from{transform:translateY(-30px);opacity:0}}
.evt{position:fixed;z-index:45;text-align:center;cursor:pointer;animation:bob 1s infinite alternate;padding:6px;touch-action:manipulation}
.evt .ei{font-size:44px;filter:drop-shadow(0 0 8px var(--acc))}.evt .et{font-family:'Press Start 2P';font-size:8px;background:#000;color:var(--acc);border:2px solid var(--acc);padding:3px;white-space:nowrap}
@keyframes bob{to{transform:translateY(-10px) rotate(6deg)}}
.tree{margin-top:8px}.tier{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.link{text-align:center;color:var(--dim);font-size:16px;line-height:1}
.sk{border:2px solid var(--dim);padding:5px;text-align:center;cursor:pointer;opacity:.6}.sk .ico{width:auto;font-size:22px}.sk .nm{font-size:7px}.sk .ds{font-size:15px}
.sk.can{opacity:1;border-color:var(--acc);box-shadow:0 0 8px var(--acc)}.sk.own{opacity:1;border-color:var(--fg);background:rgba(51,255,102,.12)}.sk.lock{opacity:.3}
.achs{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;margin-top:6px}.ach{border:2px solid var(--dim);padding:4px;opacity:.4}.ach.own{opacity:1;border-color:var(--acc)}.ach .ico{width:auto;font-size:20px}.ach .nm{font-size:7px}.ach .ds{font-size:15px}
.bulk{display:flex;gap:4px;margin-bottom:4px}.bulk button{flex:1;font-family:'Press Start 2P';font-size:9px;padding:8px;background:#000;color:var(--fg);border:2px solid var(--dim);cursor:pointer}.bulk button.on{border-color:var(--acc);color:var(--acc);box-shadow:0 0 6px var(--acc)}
.ms{position:relative;height:13px;border:1px solid var(--dim);margin-top:3px}.ms div{height:100%;background:var(--dim)}.ms span{position:absolute;left:3px;top:-2px;font-size:14px;color:#fff}
#hint{font-size:17px;color:var(--acc);min-height:18px}
.tabs button{font-size:7px;padding:10px 1px}

.float{position:fixed;pointer-events:none;font-family:'Press Start 2P';font-size:12px;color:var(--acc);text-shadow:0 0 6px var(--acc);animation:up 0.9s forwards;z-index:40}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
#modal .box{background:var(--win);color:#000;border:3px outset #fff;max-width:420px;width:100%}
#modal .hd{background:#000080;color:#fff;font-family:'Press Start 2P';font-size:10px;padding:6px}
#modal .bd{padding:12px;font-size:20px}

/* ===== compact layout v4 ===== */
html,body{font-size:18px}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:4px 6px 4px;gap:3px}
.title{font-size:10px;padding:2px 0}
.bar{padding:3px 5px;font-size:8px;box-shadow:0 0 5px var(--fg)}
.aud button{font-size:14px;padding:0 5px;min-height:32px;min-width:36px}
.big{margin:0;line-height:1.05}
#bytes{font-size:18px}
#bps{font-size:16px}#hint{font-size:15px;min-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#buffs{margin:0}
canvas{flex:0 0 auto;height:auto;max-height:24vh;object-fit:contain;border-width:2px;box-shadow:0 0 8px var(--fg)}
#tap{margin:2px 0;padding:10px;min-height:44px;font-size:12px;border-bottom-width:4px}
.era{margin:0;font-size:7px}.prog{height:8px;margin:1px 0}
.tabs{margin-top:2px;gap:2px}.tabs button{padding:0 1px;min-height:40px;font-size:7px;border-width:2px}
.panel{flex:1 1 auto;min-height:150px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px;overscroll-behavior:contain}
.item{padding:4px 6px;margin:3px 0;gap:6px;min-height:44px}
.ico{font-size:22px;width:28px}.ds{font-size:15px}.cs{font-size:16px}.cnt{font-size:12px}
.ms{height:11px;margin-top:2px}.ms span{font-size:12px;top:-2px}
.bulk{margin-bottom:2px}.bulk button{padding:0;min-height:40px}
.log{flex:0 0 auto;height:34px;font-size:14px;margin:0}
.toast{padding:5px 8px;font-size:16px;margin-bottom:4px}
#toasts{top:auto;bottom:6px}
@media (max-height:700px){canvas{max-height:20vh}.log{height:18px}.title{display:none}}
@media (min-height:900px){canvas{max-height:30vh}}
</style></head><body>
<div id="crt"></div>
<div id="app">
 <div class="title">▓ GEEK.EXE ▓</div>
 <div class="bar"><span id="eraName">ERA</span><span id="pp">⚛ 0</span><span class="aud"><button id="mus">🎵</button><button id="sfxb">🔊</button></span></div><div id="toasts"></div>
 <div class="big"><div id="bytes">0 B</div><div id="bps">0 Byte/sn</div><div id="hint"></div></div>
 <div id="buffs"></div><canvas id="scene" width="160" height="100"></canvas>
 <button id="tap">⌨ KOD YAZ!</button>
 <div class="era" id="eraNext"></div><div class="prog"><div id="eraBar" style="width:0"></div></div>
 <div class="tabs"><button data-t="shop" class="on">DONANIM</button><button data-t="up">UPGRADE</button><button data-t="sk">SKILL</button><button data-t="ach">BAŞARIM</button><button data-t="goal">HEDEF</button></div>
 <div class="panel" id="panel"></div>
 <div class="log" id="log"></div>
</div>
<div id="modal"><div class="box"><div class="hd" id="mh"></div><div class="bd" id="mb"></div></div></div>
<script>
const $=s=>document.querySelector(s);
const U=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
function fmt(n){if(n<1000)return n<10?(Math.floor(n*10)/10).toString():Math.floor(n).toString();let i=Math.floor(Math.log10(n)/3);if(i>=U.length)return n.toExponential(2);return (n/10**(i*3)).toFixed(2)+U[i]}
const RC=12,RP=7,CB=k=>Math.round(10*RC**k*(k?1.5:1)),PB=k=>.5*RP**k;
const B=[ // buildings
 {id:'kb',n:'Mekanik Klavye',i:'⌨️',d:'Tık tık tık... Cherry MX Blue',c:CB(0),p:PB(0)},
 {id:'cof',n:'Kahve',i:'☕',d:'Coffee → Code dönüşümü',c:CB(1),p:PB(1)},
 {id:'so',n:'Stack Overflow',i:'📚',d:'Copy-paste mühendisliği',c:CB(2),p:PB(2)},
 {id:'lin',n:'Linux Box',i:'🐧',d:'sudo apt install verim',c:CB(3),p:PB(3)},
 {id:'gpu',n:'GPU',i:'🎮',d:'RGB = +%20 FPS',c:CB(4),p:PB(4)},
 {id:'rack',n:'Server Rack',i:'🗄️',d:'Vıııınnnn sesi',c:CB(5),p:PB(5)},
 {id:'cloud',n:'Cloud Cluster',i:'☁️',d:'Başkasının bilgisayarı',c:CB(6),p:PB(6)},
 {id:'ai',n:'AI Model',i:'🤖',d:'Kodunu kendisi yazıyor',c:CB(7),p:PB(7)},
 {id:'q',n:'Quantum Computer',i:'⚛️',d:'Hem 0 hem 1',c:CB(8),p:PB(8)},
 {id:'dys',n:'Dyson Datacenter',i:'☀️',d:'Güneşi soğutucu yaptık',c:CB(9),p:PB(9)},
];
const GROW=1.13, MS=[10,25,50,100,150,200,300,400,500];
const msCount=n=>MS.filter(x=>n>=x).length;
const nextMs=n=>MS.find(x=>n<x);
const UP=[
 {id:'u1',n:'Vim Öğren',i:'📝',d:'Tık gücü x2 (çıkışı bulursan)',c:CB(0)*4,f:s=>s.clk*=2},
 {id:'u2',n:'Dark Mode',i:'🌙',d:'Klavye x2',c:CB(0)*12,f:s=>s.m.kb*=2},
 {id:'u3',n:'Espresso',i:'☕',d:'Kahve x2',c:CB(1)*8,f:s=>s.m.cof*=2},
 {id:'u4',n:'Rubber Duck',i:'🦆',d:'Tık gücü x3',c:CB(1)*20,f:s=>s.clk*=3},
 {id:'u5',n:'Reputation 10K',i:'🏅',d:'Stack Overflow x2',c:CB(2)*8,f:s=>s.m.so*=2},
 {id:'u7',n:'Tık = %1 BPS',i:'🖱️',d:'Her tık, saniyelik üretimin %1i kadar ekler',c:CB(2)*15,f:s=>s.clkPct+=.01},
 {id:'u6',n:'Arch btw',i:'🐧',d:'Linux x2',c:CB(3)*8,f:s=>s.m.lin*=2},
 {id:'u15',n:'Lubed Switches',i:'🧴',d:'Klavye & Kahve x3',c:CB(3)*20,f:s=>{s.m.kb*=3;s.m.cof*=3}},
 {id:'u8',n:'Overclock',i:'🔥',d:'GPU x2',c:CB(4)*8,f:s=>s.m.gpu*=2},
 {id:'u10',n:'10x Engineer',i:'🦸',d:'Her şey x2',c:CB(4)*25,f:s=>s.all*=2},
 {id:'u16',n:'Liquid Cooling',i:'💧',d:'GPU & Rack x2',c:CB(5)*8,f:s=>{s.m.gpu*=2;s.m.rack*=2}},
 {id:'u9',n:'Kubernetes',i:'⎈',d:'Rack & Cloud x2',c:CB(6)*8,f:s=>{s.m.rack*=2;s.m.cloud*=2}},
 {id:'u17',n:'Serverless',i:'λ',d:'Cloud x3',c:CB(6)*25,f:s=>s.m.cloud*=3},
 {id:'u13',n:'Tık = %5 BPS',i:'⚡',d:'Tıklar daha da güçlü',c:CB(7)*5,f:s=>s.clkPct+=.04},
 {id:'u11',n:'Transformer',i:'🧠',d:'AI x3',c:CB(7)*10,f:s=>s.m.ai*=3},
 {id:'u14',n:'Self-Improving AI',i:'♾️',d:'Her şey x3',c:CB(8)*8,f:s=>s.all*=3},
 {id:'u12',n:'Error Correction',i:'🧪',d:'Quantum x3',c:CB(8)*20,f:s=>s.m.q*=3},
 {id:'u18',n:'Dyson Swarm',i:'🛰️',d:'Dyson x3',c:CB(9)*10,f:s=>s.m.dys*=3},
 {id:'u19',n:'Recursive Self-Compile',i:'🌀',d:'Her şey x5',c:CB(9)*40,f:s=>s.all*=5},
];
const ERA=[
 {n:'GARAJ',at:0,fg:'#33ff66',dim:'#1a7a33',bg:'#020a04',wall:'#3a2a1a',floor:'#2a1a0a'},
 {n:'STARTUP',at:5e4,fg:'#ffb000',dim:'#8a5a00',bg:'#0a0600',wall:'#2a3a4a',floor:'#3a3a3a'},
 {n:'DATACENTER',at:5e6,fg:'#33ccff',dim:'#1a6a8a',bg:'#00060a',wall:'#101820',floor:'#202830'},
 {n:'AI LAB',at:1e9,fg:'#ff55ff',dim:'#8a2a8a',bg:'#0a000a',wall:'#1a0a2a',floor:'#100818'},
 {n:'SINGULARITY',at:5e11,fg:'#ffffff',dim:'#888888',bg:'#050505',wall:'#000010',floor:'#000'},
];
const GOAL=1e13;const ppGain=t=>Math.floor(10*Math.cbrt(t/GOAL)); // AGI
let S;
function fresh(pp=0,best=0){return{b:0,tot:0,all:0,own:{},ups:[],pp,best,agi:0,t:Date.now(),clicks:0}}
function load(){try{S=JSON.parse(localStorage.geekidle)}catch(e){} if(!S)S=fresh(); S.own=S.own||{};}
function save(){S.t=Date.now();localStorage.geekidle=JSON.stringify(S)}
function stats(){const s={clk:1,m:{},all:1,clkPct:0};B.forEach(b=>s.m[b.id]=2**msCount(S.own[b.id]||0));S.ups.forEach(id=>UP.find(u=>u.id==id).f(s));
 s.all*=1+S.pp*.1;extra(s);let bps=0;B.forEach(b=>bps+=(S.own[b.id]||0)*b.p*s.m[b.id]);s.bps=bps*s.all;s.click=s.clk*s.all+s.bps*s.clkPct;return s}
const cost=(b,n=1)=>{const o=S.own[b.id]||0;return Math.ceil(b.c*costMul()*GROW**o*(GROW**n-1)/(GROW-1))};
function eraIdx(){let i=0;ERA.forEach((e,k)=>{if(S.tot>=e.at)i=k});return i}
function log(t){const l=$('#log');l.innerHTML='&gt; '+t+'<br>'+l.innerHTML}
function earn(x){S.b+=x;S.tot+=x}
let tab='shop',curEra=-1,st,bulk=1;
function bulkN(b){if(bulk!='max')return bulk;let n=0;while(n<1000&&cost(b,n+1)<=S.b)n++;return n}
const eta=x=>{const r=st.bps+st.click*2;if(x<=S.b)return 'HAZIR!';if(r<=0)return '?';const s=(x-S.b)/r;return s<60?Math.ceil(s)+'sn':s<3600?Math.ceil(s/60)+'dk':(s/3600).toFixed(1)+'sa'};
function hint(){const c=[];B.forEach((b,k)=>{if(k==0||(S.own[B[k-1].id]||0)>0||S.tot>=b.c*.5)c.push([b.n,cost(b)])});UP.forEach(u=>{if(!S.ups.includes(u.id)&&S.tot>=u.c*.1)c.push(['⬆ '+u.n,u.c])});
 const nx=c.filter(x=>x[1]>S.b).sort((a,b)=>a[1]-b[1])[0];const rdy=c.filter(x=>x[1]<=S.b).length;
 return (rdy?'✅ '+rdy+' şey alınabilir! ':'')+(nx?'▶ '+nx[0]+': '+eta(nx[1]):'')}
function render(){
 $('#bytes').textContent=fmt(S.b)+' B';$('#bps').textContent=fmt(st.bps)+' Byte/sn · tık: '+fmt(st.click);$('#hint').textContent=hint();
 $('#pp').textContent='⚛ '+S.pp+' (+%'+S.pp*10+')';
 const ei=eraIdx(),e=ERA[ei];
 if(ei!=curEra){if(curEra>=0){log('YENİ ÇAĞ: '+e.n+'!');popup('ÇAĞ ATLANDI','<b>'+e.n+'</b><br>Odan büyüyor, yeni ekipmanlar açıldı!')}curEra=ei;
  const r=document.documentElement.style;r.setProperty('--fg',e.fg);r.setProperty('--dim',e.dim);r.setProperty('--bg',e.bg);document.body.style.background=e.bg;$('#eraName').textContent='ÇAĞ '+(ei+1)+': '+e.n}
 const nx=ERA[ei+1],tgt=nx?nx.at:GOAL,from=e.at;
 $('#eraNext').textContent=nx?'SONRAKİ ÇAĞ: '+nx.n+' ('+fmt(tgt)+') · ~'+eta(S.b+tgt-S.tot):'NİHAİ HEDEF: AGI ('+fmt(GOAL)+')';
 $('#eraBar').style.width=Math.min(100,(S.tot-from)/(tgt-from)*100)+'%';
 renderPanel();
}
function renderPanel(){
 const p=$('#panel');let h='';
 if(tab=='shop'){let shown=0;h+=`<div class="bulk">${[1,10,'max'].map(v=>`<button data-bulk="${v}" class="${bulk==v?'on':''}">${v=='max'?'MAX':'x'+v}</button>`).join('')}</div>`;
  B.forEach((b,k)=>{const own=S.own[b.id]||0,n=bulkN(b),c=cost(b,Math.max(1,n));const vis=k==0||(S.own[B[k-1].id]||0)>0||S.tot>=b.c*.5;
  if(!vis&&shown++)return;const nm=nextMs(own),mc=msCount(own);
  h+=`<div class="item ${!vis?'hide':S.b>=c&&n>0?'ok':'no'}" data-b="${k}"><div class="ico">${vis?b.i:'❓'}</div><div class="inf"><div class="nm">${vis?b.n:'???'}</div><div class="ds">${b.d} · +${fmt(b.p*st.m[b.id]*st.all)}/sn</div><div class="cs">💾 ${fmt(c)}${n>1?' <b>(x'+n+')</b>':''}</div>${vis&&nm?`<div class="ms"><div style="width:${own/nm*100}%"></div><span>🎯 ${own}/${nm} → x2${mc?' · aktif x'+2**mc:''}</span></div>`:''}</div><div class="cnt">${own}</div></div>`})}
 else if(tab=='up'){const av=UP.filter(u=>!S.ups.includes(u.id)&&S.tot>=u.c*.1);if(!av.length)h='<div class="ds">Şimdilik yeni upgrade yok. Daha çok kod yaz!</div>';
  av.forEach(u=>h+=`<div class="item ${S.b>=u.c?'ok':'no'}" data-u="${u.id}"><div class="ico">${u.i}</div><div class="inf"><div class="nm">${u.n}</div><div class="ds">${u.d}</div><div class="cs">💾 ${fmt(u.c)}</div></div></div>`);
  h+=`<div class="ds" style="margin-top:8px">Alınan: ${S.ups.length}/${UP.length}</div>`}
 else if(tab=='sk')h=skillPanel();else if(tab=='ach')h=achPanel();else{const gain=ppGain(S.tot);
  h=`<div class="nm">🎯 NİHAİ GÖREV: AGI'yi İNŞA ET</div><div class="ds">Yatak odasındaki 8086'dan başlayıp Singularity'ye ulaş. ${fmt(GOAL)} Byte toplam üret ve AGI'yi derle.</div>
  <div class="prog"><div style="width:${Math.min(100,S.tot/GOAL*100)}%"></div></div><div class="ds">${fmt(S.tot)} / ${fmt(GOAL)} · AGI derlendi: ${S.agi} kez</div>
  <button class="btn" id="agi" ${S.tot>=GOAL?'':'disabled'}>🧠 AGI'yi DERLE</button>
  <div class="nm" style="margin-top:14px">♻ REBOOT (PRESTIGE)</div><div class="ds">Her şeyi sıfırla, Quantum Bit (⚛) kazan. Her ⚛ = kalıcı +%10 üretim. İlk ⚛ ${fmt(GOAL/1000)} toplamda açılır; AGI'de 10 ⚛.</div>
  <button class="btn" id="pre" ${gain>0?'':'disabled'}>REBOOT → ⚛ ${gain}} kazan</button>
  <div class="ds" style="margin-top:12px">Toplam tık: ${S.clicks} · En iyi: ${fmt(S.best)}</div>
  <button class="btn" id="wipe" style="background:#a33;color:#fff">FORMAT C: (sil)</button>`}
 p.innerHTML=h;
}
